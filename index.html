<!DOCTYPE html>
<html>

<head>
    <title>AllSpark Editor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
            display: flex;
            flex-direction: row;
            height: 100vh;
            padding-top: 36px; /* top bar height */
            background: #111;
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
        }

        /* ── Left: Outliner (Hierarchy) ── */
        #ui-panel {
            flex-shrink: 0;
            width: 240px;
            height: calc(100vh - 36px);
            display: flex;
            flex-direction: column;
            background: #141414;
            border-right: 1px solid #2a2a2a;
            order: 1;
        }

        #hierarchy-panel {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        /* ── Center: Game viewport ── */
        #gameContainer {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 36px);
            background: #1a1a1a;
            order: 2;
            overflow: hidden;
            min-width: 0;
        }

        /* ── Right: Details (Inspector) ── */
        #details-panel-wrap {
            flex-shrink: 0;
            width: 300px;
            height: calc(100vh - 36px);
            display: flex;
            flex-direction: column;
            background: #141414;
            border-left: 1px solid #2a2a2a;
            order: 3;
            overflow: hidden;
        }

        #inspector-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        /* ── Scrollable content areas ── */
        .panel-scroll {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            min-height: 0;
        }

        .panel-scroll::-webkit-scrollbar {
            width: 4px;
        }

        .panel-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .panel-scroll::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 2px;
        }

        .panel-scroll::-webkit-scrollbar-thumb:hover {
            background: #3a3a3a;
        }
    </style>
<script defer src="bundle.js?ec44b717d020d6a03127"></script></head>

<body>
    <!-- Left: Outliner -->
    <div id="ui-panel">
        <div id="hierarchy-panel"></div>
    </div>

    <!-- Center: Game viewport -->
    <div id="gameContainer"></div>

    <!-- Right: Details -->
    <div id="details-panel-wrap">
        <div id="inspector-panel"></div>
    </div>

    <div id="root"></div>
</body>

</html>
